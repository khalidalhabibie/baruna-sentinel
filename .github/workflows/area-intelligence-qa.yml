name: BARUNA Tanjung Emas intelligence UI review

on:
  pull_request:
    paths:
      - 'src/saas-app.js'
      - 'saas.css'
      - 'scripts/saas-smoke.mjs'
      - '.github/workflows/area-intelligence-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  area-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI and testing dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          command -v google-chrome
      - name: JS syntax, source scientific scope and static build
        run: |
          node --check src/saas-app.js
          node --check scripts/saas-smoke.mjs
          node --test src/insight-ranking.test.js src/multi-gnss-evidence.test.js src/real-hyp3-insar.test.js
          npm run build
      - name: Browser review - direct deep links, source ranking, mobile
        run: |
          python3 -m http.server 4173 -d dist --bind 127.0.0.1 >/tmp/baruna-area-server.log 2>&1 &
          sleep 2
          node scripts/saas-smoke.mjs
      - name: Upload source-backed SaaS screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baruna-area-intelligence-review
          path: reports/baruna-saas-*.png
          if-no-files-found: ignore

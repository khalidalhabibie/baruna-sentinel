name: BARUNA data acquisition checks

on:
  push:
    paths:
      - 'acquire.command'
      - 'scripts/data-acquisition/**'
      - '.github/workflows/data-acquisition-check.yml'
  pull_request:
    paths:
      - 'acquire.command'
      - 'scripts/data-acquisition/**'
      - '.github/workflows/data-acquisition-check.yml'

jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Shell syntax
        run: bash -n acquire.command
      - name: Compile Python
        run: python -m py_compile scripts/data-acquisition/acquire.py scripts/data-acquisition/test_acquire.py
      - name: Offline unit tests
        run: python -m unittest discover -s scripts/data-acquisition -p 'test_*.py' -v

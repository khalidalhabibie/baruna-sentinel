name: Browser demo smoke check
on:
  push:
    paths:
      - "src/**"
      - "index.html"
      - "styles.css"
      - "project-ui.css"
      - "data/**"
      - "scripts/browser-smoke.mjs"
      - "scripts/production-check.mjs"
      - "scripts/build-static.mjs"
      - "vercel.json"
      - "package.json"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser test environment
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Validate scientific boundaries, source syntax and tests
        run: npm run check
      - name: Start offline-capable static app
        run: |
          npm run build
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 > /tmp/sentinel-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/ > /dev/null
      - name: Verify authentic data, UI, evidence export and mobile layout
        run: node scripts/browser-smoke.mjs
      - name: Exercise live production view switching (non-blocking diagnostic)
        if: always()
        continue-on-error: true
        run: node scripts/production-check.mjs
      - name: Inspect public deployment assets (non-blocking diagnostic)
        if: always()
        run: |
          for path in "/" "/src/navigation.js" "/src/app.js" "/src/station-qc.js" "/vendor/leaflet/leaflet.js"; do
            url="https://baruna-sentinel.vercel.app${path}"
            response=$(curl --max-time 12 --connect-timeout 5 -L -sS -o /dev/null -w "%{http_code}" "$url" 2>/dev/null || true)
            echo "PRODUCTION_DIAGNOSTIC $path HTTP ${response:-UNREACHABLE}"
          done
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-judge-demo-screenshots
          path: |
            reports/sentinel-judge-demo-*.png
            reports/sentinel-judge-evidence-dossier.pdf
          if-no-files-found: ignore

name: Browser demo smoke check
on:
  push:
    paths:
      - "src/**"
      - "index.html"
      - "styles.css"
      - "data/**"
      - "scripts/browser-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser test environment
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Start offline-capable static app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/sentinel-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/ > /dev/null
      - name: Verify authentic data, UI, evidence export and mobile layout
        run: node scripts/browser-smoke.mjs
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-judge-demo-screenshots
          path: |
            reports/sentinel-judge-demo-*.png
            reports/sentinel-judge-evidence-dossier.pdf
          if-no-files-found: ignore

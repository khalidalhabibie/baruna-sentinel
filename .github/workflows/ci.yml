name: Sentinel MVP checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned map library
        run: npm install --no-audit --no-fund
      - name: Python CLI syntax preflight
        run: python3 -m py_compile scripts/verify_igs_rinex.py
      - name: Syntax and scientific guardrail tests
        run: npm run check

      - name: Install Playwright wrapper and locate system Chrome
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          command -v google-chrome
          google-chrome --version
      - name: Test guided tour, assessment and responsive product
        run: |
          python3 -m http.server 4173 -d dist >/tmp/baruna-static-server.log 2>&1 &
          sleep 2
          node scripts/product-tour-smoke.mjs
          node scripts/spatial-demo-smoke.mjs
          node scripts/real-workspace-smoke.mjs
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baruna-product-visual-qa
          path: reports/*.png
          if-no-files-found: ignore

      - name: Export self-contained spatial video demo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baruna-spatial-standalone-html
          path: dist/baruna-spatial-demo-standalone.html
          if-no-files-found: error

name: BARUNA ranking scientific and browser checks

on:
  pull_request:
    paths:
      - 'src/workspace-ranking-model.js'
      - 'src/ranking-center.js'
      - 'src/insar-network-readiness.js'
      - 'src/insar-network-readiness.test.js'
      - 'data/semarang-asf-burst-network-20261118.json'
      - 'src/aoi-*.js'
      - 'data/gnss-published-2023-stations.geojson'
      - 'ranking-center.html'
      - 'ranking-center.css'
      - 'aoi-registry.html'
      - 'scripts/build-static.mjs'
      - 'scripts/ranking-center-smoke.mjs'
      - '.github/workflows/ranking-center-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ranking-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned public dependencies
        run: npm install --no-audit --no-fund
      - name: Scientific gates, backup compatibility and multi-scope rank tests
        run: |
          node --check src/workspace-ranking-model.js
          node --check src/ranking-center.js
          node --check src/insar-network-readiness.js
          node --check src/aoi-registry.js
          node --test src/insar-network-readiness.test.js src/real-hyp3-insar.test.js src/workspace-ranking-model.test.js src/aoi-infrastructure-cases.test.js tests/aoi-local-backup.test.js tests/aoi-registry-model.test.js
      - name: Build deployment with source-validated published GNSS
        run: npm run build
      - name: Prepare Playwright system Chrome
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          command -v google-chrome
      - name: Browser smoke for ranking and AOI data persistence
        run: |
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/baruna-ranking-server.log 2>&1 &
          sleep 2
          node scripts/ranking-center-smoke.mjs
          node scripts/aoi-registry-smoke.mjs
      - name: Preserve UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baruna-ranking-ui-review
          path: reports/baruna-*ranking*.png
          if-no-files-found: ignore
